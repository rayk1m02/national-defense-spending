version: 2

models:
  - name: dim_product
    description: One row per NAICS + PSC combination.
    columns:
      - name: product_key
        description: Surrogate key, hash of naics_code and product_or_service_code.
        data_tests:
          - unique
          - not_null
      - name: naics_code
        description: 6 digit North American Industry Classification System code for the industry the work falls under.
      - name: naics_description
        description: NAICS title, most recent wording (titles changed in 2017, 2022 revisions).
      - name: product_or_service_code
        description: 4 character GSA Product and Service Code for what was bought (digit = product, letter = services/R&D/construction).
      - name: product_or_service_code_description
        description: PSC title, most recent wording.
      - name: psc_portfolio_group
        description: PSC rolled up to R&D, Supplies/Equipment, Construction, or Services from the first character of the code.
        data_tests:
          - accepted_values:
              arguments:
                values: ['R&D', 'Supplies/Equipment', 'Construction', 'Services']
  - name: dim_location
    description: One row per place of performance (country, state, county, city).
    columns:
      - name: location_key
        description: Surrogate key, hash of country, state code, county, and city.
        data_tests:
          - unique
          - not_null
      - name: primary_place_of_performance_country_name
        description: Country where the work is performed.
      - name: primary_place_of_performance_state_code
        description: 2 letter state or territory code where the work is performed. Null for most foreign locations.
      - name: primary_place_of_performance_state_name
        description: State or territory name, most recent spelling per code.
      - name: primary_place_of_performance_county_name
        description: County where the work is performed.
      - name: primary_place_of_performance_city_name
        description: City where the work is performed.
  - name: dim_date
    description: One row per day, 1950-01-01 to 2079-12-31. Fact dates outside this range have a null date key.
    columns:
      - name: date_day
        description: Calendar date. Natural key, referenced by the fact table as action, period of performance start and end, and solicitation date.
        data_tests:
          - unique
          - not_null
      - name: fiscal_year
        description: Federal fiscal year (starts October 1).
        data_tests:
          - not_null
  - name: dim_agency
    description: One row per agency, sub-agency. Combined from awarding and funding values.
    columns:
      - name: agency_key
        description: Surrogate key, hash of agency_code and sub_agency_name.
        data_tests:
          - unique
          - not_null
      - name: agency_code
        description: Toptier agency code (some agencies use 4 digit codes).
      - name: agency_name
        description: Toptier agency name.
      - name: sub_agency_name
        description: Subagency name, NPPD is mapped to CISA (renamed 2018). A few NPPD funding rows may be non-CISA components.
      - name: budget_subfunction
        description: Subfunction by agency code (051 DoD, 053 DOE, 054 DOT and DHS). Describes the awarding scope.
        data_tests:
          - accepted_values:
              arguments:
                values: ['051', '053', '054']
  - name: dim_recipient
    description: >
      One row per recipient per version (scd2). A version is defined by a change in the dominant parent UEI or state in terms of the absolute federal obligation in a fiscal year.
      Large companies can switch between entities under the same corporate family.
    columns:
      - name: recipient_key
        description: Surrogate key (hash of recipient_uei and version's start fiscal year).
        data_tests:
          - unique
          - not_null
      - name: recipient_uei
        description: Unique entity ID of the recipient.
        data_tests:
          - not_null
          - unique:
              config:
                where: "is_current"
      - name: recipient_name
        description: Recipient name, latest value.
      - name: recipient_parent_uei
        description: Dominant parent UEI for this version.
      - name: recipient_parent_name
        description: Recipient parent name, latest value.
      - name: recipient_state_code
        description: Dominant registered state for this version (where the company is based, not necessarily where work is performed).
      - name: veteran_owned_business
        description: Veteran-owned business, latest value.
      - name: woman_owned_business
        description: Woman-owned business, latest value.
      - name: women_owned_small_business
        description: Women-owned small business (WOSB program), latest value.
      - name: minority_owned_business
        description: Minority-owned business, latest value.
      - name: small_disadvantaged_business
        description: Small disadvantaged business, latest value.
      - name: c8a_program_participant
        description: Participant in the SBA 8(a) Business Development program, latest value.
      - name: historically_underutilized_business_zone_hubzone_firm
        description: Certified HUBZone firm (located in an economically distressed area), latest value.
      - name: domestic_or_foreign_entity_code
        description: Domestic or foreign entity code, latest value.
      - name: domestic_or_foreign_entity
        description: Domestic or foreign entity description, latest value.
      - name: effective_start_date
        description: First day of the version (Oct 1, start of its first fiscal year).
        data_tests:
          - not_null
      - name: effective_end_date
        description: Last day of the version (Sep 30, end of the fiscal year before the next version starts). Null for the current version.
      - name: is_current
        description: True for each recipient's current version.
        data_tests:
          - not_null
  - name: dim_award
    description: >
      One row per award type combination (award vs IDV, award type, IDV type, parent type, pricing).
      parent_award_id_piid is on fct_transaction, since it identifies a specific parent vehicle (thousands of values) rather than a type.
      Including it would make this table almost one row per contract.
    columns:
      - name: award_key
        description: Surrogate key, hash of the seven type columns.
        data_tests:
          - unique
          - not_null
      - name: award_or_idv_flag
        description: Award (actual purchase) or IDV (Indefinite Delivery Vehicle that orders are placed under).
      - name: award_type_code
        description: A is BPA call, B is purchase order, C is delivery order, D is definitive contract, Null is IDV's.
      - name: award_type
        description: Award type description (most common wording for code).
      - name: idv_type
        description: Type of IDV (IDIQ, GSA schedule, BPA). Null for awards.
      - name: parent_award_type
        description: Type of the IDV an order was placed under. Null for no parent.
      - name: multiple_or_single_award_idv
        description: Whether the IDV was awarded to a single vendor or multiple.
      - name: type_of_idc
        description: Indefinite delivery contract type (indefinite quantity, requirements, etc).
      - name: type_of_contract_pricing_code
        description: Pricing arrangement code (J for firm fixed price, U for cost plus fixed fee, etc).
      - name: type_of_contract_pricing
        description: Pricing arrangement description (most common wording for code).
  - name: dim_competition
    description: One row per competition/set-aside combination (junk dimension). number_of_offers_received is a measure on fct_transaction.
    columns:
      - name: competition_key
        description: Surrogate key, hash of the four competition columns.
        data_tests:
          - unique
          - not_null
      - name: extent_competed
        description: How much competition the contract had (e.g. full and open, not competed, follow-on).
      - name: type_of_set_aside
        description: Set-aside program the contract was reserved for (e.g. small business, 8(a), HUBZone). Null or none when not set aside.
      - name: other_than_full_and_open_competition
        description: Justification for not competing the contract. Null when the contract was competed. Wording standardized in staging (FAR citations removed).
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'AUTHORIZED BY STATUTE'
                  - 'AUTHORIZED RESALE'
                  - 'BRAND NAME DESCRIPTION'
                  - 'FOLLOW-ON CONTRACT'
                  - 'INTERNATIONAL AGREEMENT'
                  - 'LESS THAN OR EQUAL TO THE MICRO-PURCHASE THRESHOLD'
                  - 'MOBILIZATION, ESSENTIAL R&D'
                  - 'NATIONAL SECURITY'
                  - 'ONLY ONE SOURCE - OTHER'
                  - 'PATENT OR DATA RIGHTS'
                  - 'PUBLIC INTEREST'
                  - 'SAP NON-COMPETITION'
                  - 'STANDARDIZATION'
                  - 'UNIQUE SOURCE'
                  - 'UNSOLICITED RESEARCH PROPOSAL'
                  - 'URGENCY'
                  - 'UTILITIES'
      - name: contracting_officers_determination_of_business_size
        description: Small or other than small, decided per contract against that contract's NAICS size standard. Describes the contract, not the company.
        data_tests:
          - accepted_values:
              arguments:
                values: ['SMALL BUSINESS', 'OTHER THAN SMALL BUSINESS']
  - name: fct_transaction
    description: One row per contract transaction. Measures plus keys to all seven dimension models.
    columns:
      - name: contract_transaction_unique_key
        description: PK, unique per transaction.
        data_tests:
          - unique
          - not_null
      - name: awarding_office_code
        description: Awarding office code. Used to group DOE defense offices (NNSA, EM).
      - name: c8a_program_participant
        description: 8(a) flag as of this transaction (dim_recipient has the latest value only). Same for the other four business flags on this table.
      - name: action_date_key
        description: FK to dim_date, role action date (when transaction happened).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: awarding_agency_key
        description: FK to dim_agency, role awarding.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_agency')
                field: agency_key
      - name: funding_agency_key
        description: FK to dim_agency, role funding.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_agency')
                field: agency_key
      - name: recipient_key
        description: FK to dim_recipient, the version in effect on the action date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_recipient')
                field: recipient_key
      - name: location_key
        description: FK to dim_location.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: product_key
        description: FK to dim_product.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: award_key
        description: FK to dim_award.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_award')
                field: award_key
      - name: competition_key
        description: FK to dim_competition.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_competition')
                field: competition_key