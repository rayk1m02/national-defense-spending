version: 2

models:
  - name: dim_product
    description: One row per NAICS + PSC combination
    columns:
      - name: product_key
        description: Surrogate key, hash of naics_code and product_or_service_code
        data_tests:
          - unique
          - not_null
      - name: naics_code
        description: 6 digit North American Industry Classification System code for the industry the work falls under
      - name: naics_description
        description: NAICS title, most recent wording (titles changed in 2017, 2022 revisions)
      - name: product_or_service_code
        description: 4 character GSA Product and Service Code for what was bought (digit = product, letter = services/R&D/construction)
      - name: product_or_service_code_description
        description: PSC title, most recent wording  
      - name: psc_portfolio_group
        description: PSC rolled up to R&D, Supplies/Equipment, Construction, or Services from the first character of the code
        data_tests:
          - accepted_values:
              arguments:
                values: ['R&D', 'Supplies/Equipment', 'Construction', 'Services']
  - name: dim_location
    description: One row per place of performance (country, state, county, city)
    columns:
      - name: location_key
        description: Surrogate key, hash of country, state code, county, and city
        data_tests:
          - unique
          - not_null
      - name: primary_place_of_performance_country_name
        description: Country where the work is performed.
      - name: primary_place_of_performance_state_code
        description: 2 letter state or territory code where the work is performed. Null for most foreign locations.
      - name: primary_place_of_performance_state_name
        description: State or territory name, most recent spelling per code.
      - name: primary_place_of_performance_county_name
        description: County where the work is performed.
      - name: primary_place_of_performance_city_name
        description: City where the work is performed.
  - name: dim_date
    description: One row per day, 1950-01-01 to 2079-12-31. Fact dates outside this range have a null date key.
    columns:
      - name: date_day
        description: Calendar date. Natural key, referenced by the fact table as action, period of performance start and end, and solicitation date.
        data_tests:
          - unique
          - not_null
      - name: fiscal_year
        description: Federal fiscal year (starts October 1)
        data_tests:
          - not_null
  - name: dim_agency
    description: One row per agency, sub-agency. Combined from awarding and funding values.
    columns:
      - name: agency_key
        description: Surrogate key, hash of agency_code and sub_agency_name
        data_tests:
          - unique
          - not_null
      - name: agency_code
        description: Toptier agency code (some agencies use 4 digit codes)
      - name: agency_name
        description: Toptier agency name
      - name: sub_agency_name
        description: Subagency name, NPPD is mapped to CISA (renamed 2018). A few NPPD funding rows may be non-CISA components.
      - name: budget_subfunction
        description: Subfunction by agency code (051 DoD, 053 DOE, 054 DOT and DHS). Describes the awarding scope.
        data_tests:
          - accepted_values:
              arguments:
                values: ['051', '053', '054']