version: 2

models:
  - name: rpt_spend_monthly
    description: >
      One row per fiscal month and combination of awarding agency, product group, competition bucket, action category, and domestic/foreign entity.
      Sums of fct_transaction for the spend trend, service share, competition, product mix, seasonality, and new vs modification questions.
    columns:
      - name: fiscal_year
        description: Federal fiscal year of the action date.
        data_tests:
          - not_null
      - name: fiscal_month
        description: Month of the fiscal year (1 is October, 12 is September).
        data_tests:
          - not_null
      - name: month_start_date
        description: First day of the action month. Date column for chart axes.
        data_tests:
          - not_null
      - name: budget_subfunction
        description: Subfunction of the awarding agency (051 DoD, 053 DOE, 054 DOT and DHS).
        data_tests:
          - accepted_values:
              arguments:
                values: ['051', '053', '054']
      - name: subfunction_label
        description: budget_subfunction with a readable name, for chart legends.
        data_tests:
          - accepted_values:
              arguments:
                values: ['051 DoD', '053 DOE defense', '054 DHS CISA, DOT MARAD']
      - name: agency_code
        description: Awarding toptier agency code.
      - name: sub_agency_name
        description: Awarding sub-agency name.
      - name: service_group
        description: >
          Awarding service. Navy includes Marine Corps, Air Force includes Space Force.
          DOE is split by awarding office code into NNSA and EM (EM includes Hanford and Office of River Protection).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Army', 'Navy', 'Air Force', 'Defense-Wide', 'DOE NNSA', 'DOE EM', 'DHS CISA', 'DOT MARAD']
      - name: psc_portfolio_group
        description: PSC rolled up to R&D, Supplies/Equipment, Construction, or Services.
      - name: competition_bucket
        description: >
          extent_competed grouped into full and open, limited (restricted pool, SAP, competed orders), or sole source.
          Orders under an IDV report the IDV's extent competed, not the order's.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Full and open', 'Limited', 'Sole source', 'Not reported']
      - name: action_category
        description: >
          New contract or IDV, new order under an IDV, option exercise, funding only, or other modification.
          New means modification number 0; orders have a parent award PIID.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['New contract or IDV', 'New order under an IDV', 'Option exercise', 'Funding only', 'Other modification']
      - name: domestic_or_foreign_entity
        description: Domestic or foreign entity description from dim_recipient, latest value.
      - name: domestic_foreign_group
        description: domestic_or_foreign_entity grouped into U.S., foreign-owned U.S.-incorporated, or foreign. Latest value, so past contracts reflect current ownership.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['U.S.', 'Foreign-owned, U.S.-incorporated', 'Foreign', 'Not reported']
      - name: obligated
        description: Sum of federal_action_obligation. Additive.
      - name: transaction_count
        description: Number of transactions. Additive.
  - name: rpt_recipient_year
    description: >
      One row per recipient UEI per fiscal year. Sums of fct_transaction for the top 10, consolidation, contract type, and small business questions.
      Recipient group is the parent UEI from the dim_recipient version in effect, or the recipient's own UEI when there's no parent.
      Group UEIs and names are corrected by recipient_group_overrides for the largest companies. Group ranks are computed after the corrections.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - recipient_uei
              - fiscal_year
      - dbt_utils.expression_is_true:
          arguments:
            expression: "obligated = obligated_fixed_price + obligated_cost_reimbursement + obligated_time_and_materials + obligated_other"
    columns:
      - name: recipient_uei
        description: Unique entity ID of the recipient.
        data_tests:
          - not_null
      - name: fiscal_year
        description: Federal fiscal year of the action date.
        data_tests:
          - not_null
      - name: recipient_name
        description: Recipient name, latest value.
      - name: recipient_group_uei
        description: Parent UEI for this recipient's version, or its own UEI when there's no parent. Corrected by recipient_group_overrides for the largest companies. Used to rank companies.
        data_tests:
          - not_null
      - name: recipient_group_name
        description: Parent name (current name per USASpending), or the recipient's own name when there's no parent. Corrected by recipient_group_overrides for the largest companies.
      - name: obligated
        description: Sum of federal_action_obligation. Additive.
      - name: transaction_count
        description: Number of transactions. Additive.
      - name: obligated_fixed_price
        description: Obligated on fixed price contracts (pricing codes J, L, K, B, M, A).
      - name: obligated_cost_reimbursement
        description: Obligated on cost reimbursement contracts (pricing codes U, V, R, S, T).
      - name: obligated_time_and_materials
        description: Obligated on time and materials or labor hour contracts (pricing codes Y, Z).
      - name: obligated_other
        description: Obligated on order dependent, combination, other, or missing pricing codes.
      - name: obligated_small_business
        description: Obligated on contracts the contracting officer determined small.
      - name: obligated_8a
        description: Obligated where the 8(a) flag was true on the transaction and the contract was determined small.
      - name: obligated_sdb
        description: Obligated where the small disadvantaged business flag was true on the transaction and the contract was determined small.
      - name: obligated_wosb
        description: Obligated where the women-owned small business flag was true on the transaction and the contract was determined small.
      - name: obligated_hubzone
        description: Obligated where the HUBZone flag was true on the transaction and the contract was determined small.
      - name: obligated_veteran_owned
        description: Obligated where the veteran-owned flag was true on the transaction and the contract was determined small. Stands in for SDVOSB, which isn't in the data.
      - name: awards_started
        description: Number of awards (no IDVs) whose base record is this recipient's in this fiscal year. Additive.
      - name: awards_started_obligated
        description: Lifetime obligations to date of those awards. Average award size is sum(awards_started_obligated) / sum(awards_started). Recent years are still accumulating.
      - name: group_rank_in_year
        description: Rank of the recipient group by obligated dollars within the fiscal year (1 is largest). Ties share a rank.
        data_tests:
          - not_null
      - name: group_rank_overall
        description: Rank of the recipient group by obligated dollars across all fiscal years (1 is largest). Ties share a rank.
        data_tests:
          - not_null
  - name: rpt_state_year
    description: >
      One row per fiscal year, place of performance state, and recipient state. Sums of fct_transaction for the geographic questions.
      Foreign and Unknown rows are kept so totals reconcile; state shares should use US states and territories only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fiscal_year
              - pop_state
              - recipient_state
    columns:
      - name: fiscal_year
        description: Federal fiscal year of the action date.
        data_tests:
          - not_null
      - name: pop_state
        description: >
          Place of performance state or territory code (where the work is done).
          Foreign when performed outside the US, Unknown when the country is missing or a US location has no state.
        data_tests:
          - not_null
      - name: recipient_state
        description: >
          Recipient's registered state from the dim_recipient version in effect (where the company is based).
          Foreign for foreign entities with no state, Unknown otherwise when missing.
        data_tests:
          - not_null
      - name: obligated
        description: Sum of federal_action_obligation. Additive.
      - name: transaction_count
        description: Number of transactions. Additive.
  - name: rpt_idv
    description: >
      One row per single-award IDIQ (IDC) whose base award is in the data window (FY2017 on). Utilization is order obligations to date over the ceiling.
      Covers IDVs awarded by DoD, DOE, DHS, and DOT and the orders those agencies placed; orders by other agencies under these vehicles aren't in the data.
      Multiple-award IDVs, BPAs, and BOAs are excluded (shared or nominal ceilings). IDVs with a zero ceiling are excluded.
    columns:
      - name: idv_key
        description: contract_award_unique_key of the IDV.
        data_tests:
          - unique
          - not_null
      - name: award_id_piid
        description: IDV PIID.
      - name: base_fiscal_year
        description: Fiscal year of the IDV's base award (modification 0). Group by this to compare cohorts.
        data_tests:
          - not_null
      - name: sub_agency_name
        description: Awarding sub-agency of the IDV.
      - name: budget_subfunction
        description: Subfunction of the awarding agency.
      - name: recipient_name
        description: IDV recipient, latest name.
      - name: ceiling
        description: potential_total_value_of_award, the current ceiling including all options. Can be raised by later modifications.
      - name: orders_obligated
        description: Sum of federal_action_obligation on orders under this IDV. 0 when there are no orders.
      - name: order_count
        description: Number of distinct orders under this IDV.
      - name: utilization
        description: orders_obligated / ceiling. Can exceed 1 when the ceiling was understated or raised. Recent cohorts are still accumulating orders.
  - name: rpt_award_profile
    description: >
      Awards (no IDVs) whose base record is in the data window, counted by start fiscal year, award type, service group, size bucket, and length bucket.
      Size is total obligated across all transactions. Length is days from the base record's period of performance start to the latest end date.
      Average length is duration_days_total / awards_with_duration. Medians and correlation are in rpt_award_stats.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - start_fiscal_year
              - award_type
              - service_group
              - size_bucket
              - length_bucket
    columns:
      - name: start_fiscal_year
        description: Fiscal year of the award's base record (modification 0).
        data_tests:
          - not_null
      - name: award_type
        description: Delivery order, purchase order, BPA call, or definitive contract.
      - name: service_group
        description: Awarding service, from the service_group macro.
        data_tests:
          - not_null
      - name: size_bucket
        description: Total obligated grouped into ranges. $10K and $250K match the micro-purchase and simplified acquisition thresholds.
        data_tests:
          - not_null
      - name: size_bucket_order
        description: Sort order for size_bucket (1 is zero or negative, 8 is $1B and up).
      - name: length_bucket
        description: Award length grouped into ranges. Unknown when dates are missing or the end is before the start.
        data_tests:
          - not_null
      - name: length_bucket_order
        description: Sort order for length_bucket (1 is under 1 month, 6 is 5 years and up, 7 is unknown).
      - name: award_count
        description: Number of awards. Additive.
      - name: obligated
        description: Sum of the awards' total obligated. Additive.
      - name: duration_days_total
        description: Sum of award lengths in days, excluding unknown. Additive.
      - name: awards_with_duration
        description: Number of awards with a known length. Additive.
      - name: min_obligated
        description: Smallest award total in the group.
      - name: max_obligated
        description: Largest award total in the group.
      - name: min_duration_days
        description: Shortest award length in the group.
      - name: max_duration_days
        description: Longest award length in the group.
  - name: rpt_award_stats
    description: >
      One row per start fiscal year and award type, from int_awards. Medians and correlation aren't additive, so they're only valid at this level; don't sum or average them across rows.
      size_length_correlation is the Pearson correlation of ln(obligated) and ln(duration_days + 1), using awards with positive obligated and a known length.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - start_fiscal_year
              - award_type
    columns:
      - name: start_fiscal_year
        description: Fiscal year of the award's base record.
        data_tests:
          - not_null
      - name: award_type
        description: Delivery order, purchase order, BPA call, or definitive contract.
      - name: award_count
        description: Number of awards.
      - name: median_obligated
        description: Median award total obligated.
      - name: median_duration_days
        description: Median award length in days, awards with a known length only.
      - name: size_length_correlation
        description: Correlation of log size and log length, from -1 to 1. Positive means larger awards tend to run longer.
      - name: correlation_awards
        description: Number of awards used in the correlation (positive obligated, known length).
  - name: rpt_award_outliers
    description: >
      Awards from int_awards whose size is an extreme outlier for their sub-agency, award type, and product group: log obligated more than 3 IQRs above Q3 of the group.
      Baselines use only awards of $10K or more (the micro-purchase threshold), so token orders such as $500 minimum guarantees don't set the typical size.
      Groups with fewer than 30 such awards are skipped. The IQR has a floor of ln(2) (a doubling). Positive obligated only.
    columns:
      - name: contract_award_unique_key
        description: Award key.
        data_tests:
          - unique
          - not_null
      - name: award_id_piid
        description: Award PIID.
      - name: start_fiscal_year
        description: Fiscal year of the base record.
      - name: base_action_date
        description: Date the award was made.
      - name: award_type
        description: Award type, part of the comparison group.
      - name: sub_agency_name
        description: Awarding sub-agency, part of the comparison group.
      - name: service_group
        description: Awarding service.
      - name: psc_portfolio_group
        description: Product group of the base record, part of the comparison group. Unknown when the PSC is missing.
      - name: recipient_name
        description: Recipient, latest name.
      - name: recipient_group_name
        description: Recipient's company, corrected by recipient_group_overrides for the largest companies.
      - name: obligated
        description: Award total obligated.
      - name: group_awards
        description: Number of awards of $10K or more in the comparison group.
      - name: group_median_obligated
        description: Median award size in the comparison group.
      - name: group_q3_obligated
        description: 75th percentile award size in the comparison group.
      - name: outlier_threshold_obligated
        description: Size above which an award in this group is flagged.
      - name: times_group_median
        description: obligated divided by the group median.
      - name: iqr_distance
        description: How many IQRs (on the log scale) the award sits above Q3. Use to rank the list.