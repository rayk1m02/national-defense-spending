version: 2

models:
  - name: rpt_spend_monthly
    description: >
      One row per fiscal month and combination of awarding agency, product group, competition bucket, action category, and domestic/foreign entity.
      Sums of fct_transaction for the spend trend, service share, competition, product mix, seasonality, and new vs modification questions.
    columns:
      - name: fiscal_year
        description: Federal fiscal year of the action date.
        data_tests:
          - not_null
      - name: fiscal_month
        description: Month of the fiscal year (1 is October, 12 is September).
        data_tests:
          - not_null
      - name: month_start_date
        description: First day of the action month. Date column for chart axes.
        data_tests:
          - not_null
      - name: budget_subfunction
        description: Subfunction of the awarding agency (051 DoD, 053 DOE, 054 DOT and DHS).
        data_tests:
          - accepted_values:
              arguments:
                values: ['051', '053', '054']
      - name: agency_code
        description: Awarding toptier agency code.
      - name: sub_agency_name
        description: Awarding sub-agency name.
      - name: service_group
        description: >
          Awarding service. Navy includes Marine Corps, Air Force includes Space Force.
          DOE is split by awarding office code into NNSA and EM (EM includes Hanford and Office of River Protection).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Army', 'Navy', 'Air Force', 'Defense-Wide', 'DOE NNSA', 'DOE EM', 'DHS CISA', 'DOT MARAD']
      - name: psc_portfolio_group
        description: PSC rolled up to R&D, Supplies/Equipment, Construction, or Services.
      - name: competition_bucket
        description: >
          extent_competed grouped into full and open, limited (restricted pool, SAP, competed orders), or sole source.
          Orders under an IDV report the IDV's extent competed, not the order's.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Full and open', 'Limited', 'Sole source', 'Not reported']
      - name: action_category
        description: >
          New contract or IDV, new order under an IDV, option exercise, funding only, or other modification.
          New means modification number 0; orders have a parent award PIID.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['New contract or IDV', 'New order under an IDV', 'Option exercise', 'Funding only', 'Other modification']
      - name: domestic_or_foreign_entity
        description: Domestic or foreign entity description from dim_recipient, latest value.
      - name: domestic_foreign_group
        description: domestic_or_foreign_entity grouped into U.S., foreign-owned U.S.-incorporated, or foreign. Latest value, so past contracts reflect current ownership.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['U.S.', 'Foreign-owned, U.S.-incorporated', 'Foreign', 'Not reported']
      - name: obligated
        description: Sum of federal_action_obligation. Additive.
      - name: transaction_count
        description: Number of transactions. Additive.
  - name: rpt_recipient_year
    description: >
      One row per recipient UEI per fiscal year. Sums of fct_transaction for the top 10, consolidation, contract type, and small business questions.
      Recipient group is the parent UEI from the dim_recipient version in effect, or the recipient's own UEI when there's no parent.
      Group UEIs and names are corrected by recipient_group_overrides for the largest companies. Group ranks are computed after the corrections.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - recipient_uei
              - fiscal_year
      - dbt_utils.expression_is_true:
          arguments:
            expression: "obligated = obligated_fixed_price + obligated_cost_reimbursement + obligated_time_and_materials + obligated_other"
    columns:
      - name: recipient_uei
        description: Unique entity ID of the recipient.
        data_tests:
          - not_null
      - name: fiscal_year
        description: Federal fiscal year of the action date.
        data_tests:
          - not_null
      - name: recipient_name
        description: Recipient name, latest value.
      - name: recipient_group_uei
        description: Parent UEI for this recipient's version, or its own UEI when there's no parent. Corrected by recipient_group_overrides for the largest companies. Used to rank companies.
        data_tests:
          - not_null
      - name: recipient_group_name
        description: Parent name (current name per USASpending), or the recipient's own name when there's no parent. Corrected by recipient_group_overrides for the largest companies.
      - name: obligated
        description: Sum of federal_action_obligation. Additive.
      - name: transaction_count
        description: Number of transactions. Additive.
      - name: obligated_fixed_price
        description: Obligated on fixed price contracts (pricing codes J, L, K, B, M, A).
      - name: obligated_cost_reimbursement
        description: Obligated on cost reimbursement contracts (pricing codes U, V, R, S, T).
      - name: obligated_time_and_materials
        description: Obligated on time and materials or labor hour contracts (pricing codes Y, Z).
      - name: obligated_other
        description: Obligated on order dependent, combination, other, or missing pricing codes.
      - name: obligated_small_business
        description: Obligated on contracts the contracting officer determined small.
      - name: obligated_8a
        description: Obligated where the 8(a) flag was true on the transaction and the contract was determined small.
      - name: obligated_sdb
        description: Obligated where the small disadvantaged business flag was true on the transaction and the contract was determined small.
      - name: obligated_wosb
        description: Obligated where the women-owned small business flag was true on the transaction and the contract was determined small.
      - name: obligated_hubzone
        description: Obligated where the HUBZone flag was true on the transaction and the contract was determined small.
      - name: obligated_veteran_owned
        description: Obligated where the veteran-owned flag was true on the transaction and the contract was determined small. Stands in for SDVOSB, which isn't in the data.
      - name: group_rank_in_year
        description: Rank of the recipient group by obligated dollars within the fiscal year (1 is largest). Ties share a rank.
        data_tests:
          - not_null
      - name: group_rank_overall
        description: Rank of the recipient group by obligated dollars across all fiscal years (1 is largest). Ties share a rank.
        data_tests:
          - not_null
  - name: rpt_state_year
    description: >
      One row per fiscal year, place of performance state, and recipient state. Sums of fct_transaction for the geographic questions.
      Foreign and Unknown rows are kept so totals reconcile; state shares should use US states and territories only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fiscal_year
              - pop_state
              - recipient_state
    columns:
      - name: fiscal_year
        description: Federal fiscal year of the action date.
        data_tests:
          - not_null
      - name: pop_state
        description: >
          Place of performance state or territory code (where the work is done).
          Foreign when performed outside the US, Unknown when the country is missing or a US location has no state.
        data_tests:
          - not_null
      - name: recipient_state
        description: >
          Recipient's registered state from the dim_recipient version in effect (where the company is based).
          Foreign for foreign entities with no state, Unknown otherwise when missing.
        data_tests:
          - not_null
      - name: obligated
        description: Sum of federal_action_obligation. Additive.
      - name: transaction_count
        description: Number of transactions. Additive.